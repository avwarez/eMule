name: Build eMule (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - v0.72a-build

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
        configuration: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        # Pin an exact interpreter and put it first on PATH, so the "pip
        # install" below and CMake's own find_package(Python3) (used to run
        # mbedtls/tf-psa-crypto's code-gen scripts) resolve to the SAME
        # Python. Without this, plain "pip install jsonschema" installed into
        # a different interpreter than the one CMake found on its own
        # (C:/hostedtoolcache/windows/Python/3.14.6/x64/python3.exe) -
        # confirmed by an actual run: the install step reported success, but
        # the build still failed with ModuleNotFoundError.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mbedtls code-gen Python dependencies
        # Installed from mbedtls's own requirements file rather than named
        # ad-hoc, so this tracks whatever upstream actually needs instead of
        # us guessing/discovering packages one ModuleNotFoundError at a time.
        # Verified which scripts our exact build config runs (GEN_FILES=ON,
        # ENABLE_TESTING=OFF on MSVC): only
        # tf-psa-crypto/scripts/generate_driver_wrappers.py needs third-party
        # packages (jsonschema, jinja2) - everything else invoked
        # (generate_config_checks.py, generate_ssl_debug_helpers.py) is
        # stdlib-only. driver.requirements.txt is exactly those two packages.
        run: pip install -r mbedtls/tf-psa-crypto/scripts/driver.requirements.txt

      - name: Configure (CMake)
        # No -G: let CMake auto-detect whatever Visual Studio version is
        # actually on the runner image, instead of hardcoding a generator
        # name that stops matching once GitHub updates windows-latest to a
        # newer VS release (confirmed the cause of the first run's failure -
        # "could not find any instance of Visual Studio" for a hardcoded
        # "Visual Studio 17 2022" generator).
        #
        # No -T version=... either: pinning to this project's own dev-machine
        # toolset (14.50) was tried and confirmed NOT installed on this runner
        # image (only 14.51.36231 is) - CMake failed fast with a clear "does
        # not seem to be installed" error. cryptopp_build/CMakeLists.txt now
        # detects and works around the one real incompatibility that toolset
        # difference exposed (removed stdext:: array iterator shims), so
        # there's no reason left to fight the runner's own default toolset.
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --target emule

      - name: Upload emule.exe
        uses: actions/upload-artifact@v4
        with:
          name: emule-${{ matrix.platform }}-${{ matrix.configuration }}
          path: build/srchybrid/${{ matrix.configuration }}/emule.exe
          if-no-files-found: error
