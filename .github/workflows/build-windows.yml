name: Build eMule (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - v0.72a-build

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --target emule

      - name: Upload emule.exe
        uses: actions/upload-artifact@v4
        with:
          name: emule-${{ matrix.platform }}-${{ matrix.configuration }}
          path: build/srchybrid/${{ matrix.configuration }}/emule.exe
          if-no-files-found: error
